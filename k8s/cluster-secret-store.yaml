apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: conjur-store
spec:
  provider:
    conjur:
      url: https://latamlab.secretsmgr.cyberark.cloud
      caBundle: ""
      auth:
        jwt:
          account: conjur
          serviceID: eks-latam
          serviceAccountRef:
            name: springboot-app
            namespace: conjur
            audiences:
              - conjur
