apiVersion: apps/v1
kind: Deployment
metadata:
  name: eso-shop
  namespace: eso-shop
  labels:
    app: eso-shop
spec:
  replicas: 3
  # maxUnavailable: 0 garante que o pod antigo só termina depois do novo estar Ready
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  # Aguarda 15s com o pod Ready antes de considerar o rollout concluído
  minReadySeconds: 15
  selector:
    matchLabels:
      app: eso-shop
  template:
    metadata:
      labels:
        app: eso-shop
    spec:
      serviceAccountName: eso-shop-sa
      imagePullSecrets:
        - name: dockerhub-pull
      # Garante que o pod tenha tempo de fechar conexões em aberto
      terminationGracePeriodSeconds: 30
      containers:
        - name: eso-shop
          image: aslancarlos/k8s-eso-shop:latest
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: eso-shop-db-creds
          env:
            - name: DB_NAME
              value: "myappDB"
            - name: PORT
              value: "3000"
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SECRET_NAME
              value: "eso-shop-db-creds"
            - name: BASE_PATH
              value: "/k8s-eso"
          # Readiness: pod só recebe tráfego após responder /health
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
            successThreshold: 1
            timeoutSeconds: 2
          # Liveness: reinicia o container se travar (após 3 falhas × 15s = 45s)
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 3
          # Startup: dá até 60s para o app iniciar antes de liveness entrar em ação
          startupProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
            timeoutSeconds: 2
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: eso-shop
  namespace: eso-shop
spec:
  selector:
    app: eso-shop
  ports:
    - port: 80
      targetPort: 3000
