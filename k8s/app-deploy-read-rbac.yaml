# Lets the Shop app read its OWN Deployment so the UI can detect rollout
# restarts (restartedAt / generation) and toast them to visitors. Read-only,
# scoped to the single deployment "eso-shop".
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-shop-deploy-read
  namespace: eso-shop
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["eso-shop"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-shop-deploy-read
  namespace: eso-shop
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-shop-deploy-read
subjects:
  - kind: ServiceAccount
    name: eso-shop-sa
    namespace: eso-shop
