apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-shop-operator
  namespace: eso-shop
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-shop-operator
  namespace: eso-shop
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["eso-shop-db-creds"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["eso-shop"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-shop-operator
  namespace: eso-shop
subjects:
  - kind: ServiceAccount
    name: eso-shop-operator
    namespace: eso-shop
roleRef:
  kind: Role
  name: eso-shop-operator
  apiGroup: rbac.authorization.k8s.io
